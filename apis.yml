aid: kana
name: Kana
description: >-
  Kana is an agentic AI growth and marketing platform that helps brands discover
  high-precision audiences, optimize acquisition efficiency, and stay visible across
  AI-driven discovery environments such as LLM answer engines, search copilots, and
  autonomous agents. Founded by martech veterans Tom Chavez and Vivek Vaidya (previously
  Rapt, acquired by Microsoft, and Krux, acquired by Salesforce) and incubated in the
  super{set} startup studio, Kana raised a $15M seed round led by Mayfield in February
  2026. The platform orchestrates specialized AI agents that reason over customer data,
  plan multi-step workflows, and recommend next-best actions across a suite of purpose-built
  applications: Campaign Orchestrator, Marketing Intelligence, Personalization, Synthetic
  Data Generation, Media Proposal Generator, Category Intelligence, Audience Builder,
  OmniChannel Media Planner, and an Agentic Data Platform. Proprietary just-in-time data
  integration connects to existing CRM, CDP, marketing-automation, and data-warehouse
  systems without disruptive infrastructure changes, keeping a human-in-the-loop review
  step. Kana ships no public developer portal, but its application host apps.kana.ai does
  expose a real callable surface: an OAuth 2.0 authorization server whose RFC 8414
  metadata is served anonymously and declares MCP protocol 2025-03-26 with mcp:read /
  mcp:write / kana:read / kana:write scopes, plus a per-deployment MCP endpoint and an
  api-key-authenticated Skill API for running pipelines and retrieving their outputs.
  Everything but the OAuth metadata sits behind a 401, so this profile captures Kana's
  public identity, legal/compliance posture, authentication and scope model, and the
  shape of the gated API surface.
