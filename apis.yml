- name: Kana MCP Server
  description: >-
    Kana exposes each deployed agent/orchestrator as a remote MCP server at
    https://apps.kana.ai/mcp/{public access key}, fronted by the platform's OAuth 2.0
    authorization server (PKCE S256, RFC 7591 dynamic client registration, mcp:read and
    mcp:write scopes). The authorization-server metadata declares MCP protocol version
    2025-03-26. Tool sets are per-deployment and require an authenticated introspection,
    so no vendor-wide tool catalog is published.
  humanURL: https://apps.kana.ai/
  baseURL: https://apps.kana.ai
  tags:
  - Model Context Protocol
  - Agentic AI
  properties:
  - type: MCPServer
    url: mcp/kana-mcp.yml
  - type: Authentication
    url: authentication/kana-authentication.yml
  - type: OAuthScopes
    url: scopes/kana-scopes.yml
