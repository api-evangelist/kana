apis:
- name: Kana Skill API
  description: >-
    The callable surface a deployed Kana pipeline ("skill") exposes on the Kana
    application host. POST /skill/{pipelineid} starts a run and returns a runid;
    GET /run/{runid}/status reports progress and queue depth; GET /run/{runid}/output
    returns the skill's outputs; PUT /file_ul stages an input file and returns a
    temporary file id; GET /file_dl/{runid}/{fid} retrieves an output file. Every
    operation is authenticated with an x-kana-apikey header. Kana's signed-in console
    generates an OpenAPI 3.0.3 document per skill and renders it in an embedded Swagger
    UI; that document is not published at a public URL, so no spec is stored here.
  humanURL: https://apps.kana.ai/
  baseURL: https://apps.kana.ai
  tags:
  - Agentic AI
  - Marketing
  - Workflow
