notes: >-
  Kana publishes a legal/compliance page (kana.ai/legal) exposing a Data Processing
  Addendum, Security & Privacy Documentation (Subscription and Professional Services),
  an Infrastructure & Subprocessor list, and an Acceptable Use Policy, alongside SOC 2
  Type II and HIPAA compliance badges. The API-standards rows above were added on
  2026-08-13 after the apps.kana.ai application host was found to serve a real RFC 8414
  authorization-server metadata document anonymously — the only machine-readable
  contract Kana publishes. Everything else on that host is behind a 401, so
  cross-cutting checks that need operation-level detail (pagination, versioning,
  content negotiation) remain unassessable.
