authorization:
  server: https://apps.kana.ai
  metadata: https://apps.kana.ai/.well-known/oauth-authorization-server
  scopes:
  - mcp:read
  - mcp:write
  dynamic_client_registration: https://apps.kana.ai/oauth/register
